<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Figma to Code - Transform Your Designs into Production-Ready Applications</title>
    <meta name="description" content="Expert Figma to code conversion service. Get pixel-perfect React/Vue frontend and FastAPI/Node.js backend in 2-4 days. Professional development with senior developers.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8 text-center">
                <h1 class="display-4 fw-bold mb-4">Transform Your Figma Designs into Production-Ready Code</h1>
                <p class="lead mb-5">Expert development from design to production in 2-4 days with 100% pixel-perfect quality guarantee</p>
                
                <div class="card p-4 mb-5">
                    <h3 class="h5 fw-semibold mb-3">Evaluate your Figma design</h3>
                    <p class="text-muted mb-4">Enter the link to your Figma design and we will contact you to evaluate it.</p>
                    
                    <form action="mailto:support@onout.org?subject=Figma Design Evaluation Request&body=Hello! I would like to evaluate my Figma design. Here is the link: " method="GET">
                        <div class="mb-4">
                            <label for="figma_url" class="form-label fw-medium">Figma design link</label>
                            <input type="url" class="form-control" id="figma_url" name="figma_url" placeholder="https://www.figma.com/file/..." required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-3 fw-semibold">Get Free Evaluation</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
