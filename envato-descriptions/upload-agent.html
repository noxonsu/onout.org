function getDoneIds() {
  try { return JSON.parse(localStorage.getItem('cc_done') || '[]'); } catch { return []; }
}
function saveDone(ids) {
  localStorage.setItem('cc_done', JSON.stringify(ids));
}

function updateProgress() {
  const done = getDoneIds();
  const count = done.length;
  const total = tasks.length;
  const pct = Math.round(count / total * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressCount').textContent = `${count} / ${total}`;
}

function renderTasks() {
  const done = getDoneIds();
  const grid = document.getElementById('tasksGrid');
  grid.innerHTML = '';

  tasks.forEach(task => {
    const isDone = done.includes(task.id);
    const card = document.createElement('div');
    card.className = 'task-card' + (isDone ? ' done' : '');
    card.id = 'card-' + task.id;

    card.innerHTML = `
      <div class="card-header">
        <div class="card-header-left">
          <div class="product-icon" style="background:${task.iconBg}">${task.icon}</div>
          <div>
            <div class="card-title">${task.product}</div>
            <div class="card-subtitle">${task.subtitle}</div>
          </div>
        </div>
        <div class="status-badge ${isDone ? 'status-done' : 'status-todo'}"
             onclick="toggleDone('${task.id}')"
             id="status-${task.id}">
          ${isDone ? '✓ Done' : '○ Todo'}
        </div>
      </div>
      <div class="card-body">
        <div class="instructions">
          <ol>
            <li>Open the <a href="${task.editUrl}" target="_blank">CodeCanyon edit page</a></li>
            <li>Find the <strong>Description</strong> field (HTML source mode)</li>
            <li>Select all existing text, paste the HTML below</li>
            <li>Save / Submit</li>
          </ol>
        </div>
        <div class="cc-url"><span>Edit URL:</span> <a href="${task.editUrl}" target="_blank">${task.editUrl}</a></div>
        <div class="html-block">
          <div class="html-label">HTML Description</div>
          <textarea id="html-${task.id}" readonly>${task.html}</textarea>
          <button class="btn-copy" id="btn-${task.id}" onclick="copyHTML('${task.id}')">
            <span>📋</span> Copy HTML to Clipboard
          </button>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });

  updateProgress();
}

function toggleDone(id) {
  const done = getDoneIds();
  const idx = done.indexOf(id);
  if (idx === -1) done.push(id);
  else done.splice(idx, 1);
  saveDone(done);
  renderTasks();
}

async function copyHTML(id) {
  const textarea = document.getElementById('html-' + id);
  const btn = document.getElementById('btn-' + id);
  try {
    await navigator.clipboard.writeText(textarea.value);
    btn.className = 'btn-copy copied';
    btn.innerHTML = '<span>✓</span> Copied!';
    setTimeout(() => {
      btn.className = 'btn-copy';
      btn.innerHTML = '<span>📋</span> Copy HTML to Clipboard';
    }, 2500);
  } catch {
    textarea.select();
    document.execCommand('copy');
  }
}

renderTasks();
